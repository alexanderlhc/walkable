name: walkable
description: Track your walks. All data stays on your phone.
publish_to: none
version: 0.5.0+17

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  path: ^1.9.0
  geolocator: ^14.1.1
  permission_handler: ^13.0.2
  flutter_map: ^8.0.0
  latlong2: ^0.10.1
  shared_preferences: ^2.3.0
  package_info_plus: ^10.2.2
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  flutter_local_notifications: ^22.3.2

dev_dependencies:
  fake_async: ^1.3.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    # The license page's app icon; written by docs/icon/generate.sh.
    - assets/app_icon.png
