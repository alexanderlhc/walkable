name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  # The integration tests on an Android emulator, then the release smoke test
  # on the same one. The integration tests get no CARTO_API_KEY: nothing
  # asserts on map tiles, which just render CARTO's watermark without it. The
  # smoke test gets it when the secret is there, to build like a release; PRs
  # from forks have no secrets and an empty key passes too.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install dependencies
        run: flutter pub get

      - name: Integration tests and release smoke test
        uses: reactivecircus/android-emulator-runner@v2
        env:
          FLUTTER: flutter
          CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          # Each line runs on its own; the first failure fails the step.
          script: |
            tool/release_smoke_test.sh emulator-5554
            tool/integration_test.sh emulator-5554
