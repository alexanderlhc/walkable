name: Release

# A pushed v* tag builds and uploads to the internal track. To ship it, test
# the internal build, then run this workflow by hand with "promote": it moves
# that exact build from internal to production, without rebuilding. See
# docs/releasing.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      action:
        description: "promote = internal build → production (no rebuild); build-internal = rebuild the tag picked under \"Use workflow from\" → internal"
        type: choice
        options: [promote, build-internal]
        default: promote
      version_code:
        description: "promote: version code to promote (empty = the latest on internal; set it when widening a staged rollout)"
        type: string
        required: false
      rollout:
        description: "promote: % of production users (100 = everyone; lower = staged rollout, run again to widen)"
        type: string
        default: "100"

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'push' || inputs.action == 'build-internal'
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
          CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_PROPERTIES PLAY_STORE_JSON_KEY CARTO_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Repo secret $name is not set (just release-secrets / just carto-key)"
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Read Flutter version from .fvmrc
        id: fvm
        run: echo "flutter=$(jq -er .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.fvm.outputs.flutter }}
          cache: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: android

      - name: Materialize secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
          PLAY_STORE_JSON_KEY_CONTENT: ${{ secrets.PLAY_STORE_JSON_KEY }}
          CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          printf '%s\n' "$ANDROID_KEY_PROPERTIES" > android/key.properties
          printf '%s\n' "$PLAY_STORE_JSON_KEY_CONTENT" > "$RUNNER_TEMP/play-store-key.json"
          # The Fastfile builds with --dart-define-from-file and refuses to run without it.
          jq -n '{CARTO_API_KEY: env.CARTO_API_KEY}' > dart_defines.local.json

      - name: Deploy
        working-directory: android
        env:
          PLAY_STORE_JSON_KEY: ${{ runner.temp }}/play-store-key.json
        run: bundle exec fastlane deploy

  # Copies a release from internal to production on Play: no Flutter build, no
  # keystore, only the Play service account.
  promote:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'promote'
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          missing=0
          for name in PLAY_STORE_JSON_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Repo secret $name is not set (just release-secrets)"
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: android

      - name: Materialize secrets
        env:
          PLAY_STORE_JSON_KEY_CONTENT: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          umask 077
          printf '%s\n' "$PLAY_STORE_JSON_KEY_CONTENT" > "$RUNNER_TEMP/play-store-key.json"

      - name: Promote
        working-directory: android
        env:
          PLAY_STORE_JSON_KEY: ${{ runner.temp }}/play-store-key.json
          VERSION_CODE: ${{ inputs.version_code }}
          ROLLOUT: ${{ inputs.rollout }}
        run: bundle exec fastlane promote version_code:"$VERSION_CODE" rollout:"$ROLLOUT"
